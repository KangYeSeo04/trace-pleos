  { id: 'seoul', prov: '서울', region: '서울', name: '남산 행성', kind: '행성', c1: '#7FA8F5', c2: '#D6E2FF', c3: '#24304D', glyph: 'tower', ring: true, stay: 600000, stayTxt: '1년 3개월', km: '9,840 km' },
  { id: 'suwon', prov: '경기', region: '수원시', name: '화성 행성', kind: '행성', c1: '#E8A86A', c2: '#FFE2C4', c3: '#5A3218', glyph: 'fortress', ring: true, stay: 360, stayTxt: '6시간', km: '312 km' },
  { id: 'gangneung', prov: '강원', region: '강릉시', name: '경포 바다 펫', kind: '펫', c1: '#6ED3C8', c2: '#D2F5F0', c3: '#14504A', glyph: 'seal', ring: false, stay: 190, stayTxt: '3시간 10분', km: '214 km', isNew: true },
  { id: 'gyeongju', prov: '경북', region: '경주시', name: '첨성대 행성', kind: '행성', c1: '#B99BF0', c2: '#E7DCFF', c3: '#3A2766', glyph: 'star', ring: true, stay: 3240, stayTxt: '2일 6시간', km: '128 km' },
  { id: 'jeonju', prov: '전북', region: '전주시', name: '한옥 캐릭터', kind: '캐릭터', c1: '#F28BA9', c2: '#FFD9E4', c3: '#5C1F33', glyph: 'hanok', ring: false, stay: 540, stayTxt: '9시간', km: '158 km' },
  { id: 'busan', prov: '부산', region: '부산', name: '광안 행성', kind: '행성', c1: '#5FB0F0', c2: '#D3EBFF', c3: '#16395A', glyph: 'bridge', ring: true, stay: 0, stayTxt: '', km: '' },
  { id: 'tongyeong', prov: '경남', region: '통영시', name: '등대 펫', kind: '펫', c1: '#F4A07E', c2: '#FFE0D2', c3: '#5E2A16', glyph: 'lighthouse', ring: false, stay: 80, stayTxt: '1시간 20분', km: '96 km' },
  { id: 'jeju', prov: '제주', region: '제주시', name: '돌하르방 캐릭터', kind: '캐릭터', c1: '#A2D47E', c2: '#E2F5D2', c3: '#2E4A1C', glyph: 'stone', ring: false, stay: 0, stayTxt: '', km: '' }
];
function dexCard(d, T, dark) {
  const on = d.stay >= 180;
  const grey1 = dark ? '#3A3E45' : '#D3D7DD', grey2 = dark ? '#4A4F57' : '#E6E9ED', grey3 = dark ? '#2A2D33' : '#B9BEC6';
  const pct = Math.min(100, Math.round(d.stay / 180 * 100));
  return {
    id: d.id, name: on ? d.name : (d.stay > 0 ? d.name : '???'), region: d.region, prov: d.prov, kind: d.kind,
    c1: on ? d.c1 : grey1, c2: on ? d.c2 : grey2, c3: on ? d.c3 : grey3, glyph: GLYPH[d.glyph], ring: d.ring,
    on, locked: !on, isNew: !!d.isNew && on, visiting: !on && d.stay > 0, unvisited: d.stay === 0,
    pct, sub: on ? d.kind + ' · ' + d.stayTxt + ' 머묾' : (d.stay > 0 ? d.stayTxt + ' / 3시간' : '3시간 머물면 열려요'),
    subCol: on ? T.t2 : T.t3, nameCol: on ? T.t1 : T.t3
  };
}

const START = { seoul: [930, 1000], suwon: [1450, 960], gangneung: [1580, 1330], gyeongju: [1080, 1480], jeonju: [820, 1260] };
class Component extends DCLogic {
  renderVals() {
    const Z = this._z || (this._z = (() => {
      const z = { s: 0.55, x: 300 - 1200 * 0.55, y: 400 - 1200 * 0.55, el: null, pts: new Map(), start: null, drag: null, pos: {} };
      const W = 600, H = 800, WD = 2400;
      const apply = () => { if (z.el) z.el.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')'; };
      const clamp = () => { z.s = Math.max(0.3, Math.min(2.5, z.s)); const mx = W * 0.5, my = H * 0.5; z.x = Math.min(mx, Math.max(W - mx - WD * z.s, z.x)); z.y = Math.min(my, Math.max(H - my - WD * z.s, z.y)); };
      const loc = (e) => { const host = z.el ? z.el.parentElement : e.currentTarget; const r = host.getBoundingClientRect(); const k = r.width / W || 1; return [(e.clientX - r.left) / k, (e.clientY - r.top) / k]; };
      const zoomAt = (m, s) => { const ns = Math.max(0.3, Math.min(2.5, s)); const rr = ns / z.s; z.x = m[0] - (m[0] - z.x) * rr; z.y = m[1] - (m[1] - z.y) * rr; z.s = ns; clamp(); apply(); };
      const startFrom = () => { const P = Array.from(z.pts.values()); if (P.length === 1) z.start = { n: 1, p: P[0], x: z.x, y: z.y }; else if (P.length >= 2) { const a = P[0], b = P[1]; z.start = { n: 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s: z.s, x: z.x, y: z.y }; } else z.start = null; };
      return {
        z, apply,
        ref: (el) => {
          z.el = el; apply();
          if (el && el.parentElement && !el.parentElement.__wheel) {
            el.parentElement.__wheel = true;
            el.parentElement.addEventListener('wheel', (e) => { e.preventDefault(); const r = el.parentElement.getBoundingClientRect(); const k = r.width / W || 1; zoomAt([(e.clientX - r.left) / k, (e.clientY - r.top) / k], z.s * Math.exp(-e.deltaY * 0.0015 * (e.ctrlKey ? 6 : 1))); }, { passive: false });
          }
        },
        grab: (id) => (e) => {
          e.stopPropagation();
          const p = loc(e); const el = e.currentTarget;
          const cur = z.pos[id] || START[id];
          z.drag = { id, el, p, from: cur.slice(), pid: e.pointerId };
        },
        down: (e) => { if (z.drag) return; z.pts.set(e.pointerId, loc(e)); startFrom(); },
        move: (e) => {
          if (z.drag && e.pointerId === z.drag.pid) {
            const p = loc(e); const nx = z.drag.from[0] + (p[0] - z.drag.p[0]) / z.s, ny = z.drag.from[1] + (p[1] - z.drag.p[1]) / z.s;
            z.pos[z.drag.id] = [nx, ny]; z.drag.el.style.left = nx + 'px'; z.drag.el.style.top = ny + 'px'; return;
          }
          if (!z.pts.has(e.pointerId)) return;
          z.pts.set(e.pointerId, loc(e));
          const P = Array.from(z.pts.values());
          if (P.length >= 2 && z.start && z.start.n === 2) {
            const a = P[0], b = P[1]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
            const s = Math.max(0.3, Math.min(2.5, z.start.s * d / z.start.d)), rr = s / z.start.s;
            z.x = m[0] - (z.start.m[0] - z.start.x) * rr; z.y = m[1] - (z.start.m[1] - z.start.y) * rr; z.s = s; clamp(); apply();
          } else if (P.length === 1 && z.start && z.start.n === 1) {
            const p = P[0]; z.x = z.start.x + (p[0] - z.start.p[0]); z.y = z.start.y + (p[1] - z.start.p[1]); clamp(); apply();
          }
        },
        up: (e) => { if (z.drag && e.pointerId === z.drag.pid) { z.drag = null; return; } z.pts.delete(e.pointerId); startFrom(); },
        reset: () => { z.s = 0.55; z.x = 300 - WD / 2 * 0.55; z.y = 400 - WD / 2 * 0.55; apply(); }
      };
    })());
    setTimeout(Z.apply, 0);
    const T = { t1: '#FFFFFF', t2: '#A3A9B2', t3: '#7C828B', panel: '#17191D', tile: '#202328', line: '#2C3036', accent: '#4C9AFF' };
    const planets = DEX.filter(d => d.stay >= 180).map((d, i) => {
      const c = dexCard(d, T, true); const pos = Z.z.pos[d.id] || START[d.id]; const size = d.id === 'seoul' ? 220 : 180;
      return { id: d.id, name: c.name, region: c.region, aria: c.region + ' ' + c.name + ', 끌어서 옮길 수 있어요', c1: c.c1, c2: c.c2, c3: c.c3, glyph: c.glyph, ringOp: d.ring ? 0.85 : 0, size, half: -size / 2, x: pos[0], y: pos[1], grab: Z.grab(d.id) };
    });
    return { planets, worldT: 'translate(' + Z.z.x + 'px,' + Z.z.y + 'px) scale(' + Z.z.s + ')', worldRef: Z.ref, down: Z.down, move: Z.move, up: Z.up, reset: Z.reset };
  }
}
